# Ce qui tourne à chaque poussée, et pourquoi ce n'est pas seulement `npm test`.
#
# ─── UN CAS IGNORÉ N'EST PAS UN CAS PASSÉ, ET LA CONSTRUCTION DOIT LE DIRE ───
#
# Plusieurs cas se déclarent ignorés quand ce qu'ils devraient examiner n'est pas là. C'est le
# bon comportement — bien meilleur qu'un `return` muet qui compte parmi les réussites — mais
# sur une machine neuve, le plus important d'entre eux s'ignore : celui qui vérifie qu'AUCUNE
# valeur du client n'entre dans le fichier que l'outil lui rend. Il a besoin des poids
# d'encodeur, qui ne sont pas dans le dépôt.
#
# Sans la mise en cache ci-dessous, l'intégration continue passait au vert pendant que la
# promesse la plus importante du produit n'était éprouvée sur rien. Mesuré : 104 passés,
# 1 ignoré, et l'ignoré était celui-là.
#
# D'où deux choses : on garde les poids d'un tour à l'autre, et on REFUSE une construction qui
# ignore quoi que ce soit. Le premier tour paiera le téléchargement ; les suivants non.
name: verifier

on:
  push:
    branches: [main]
  pull_request:

# ─── LE JETON DE LA CHAÎNE N'A QUE CE QU'IL LUI FAUT ───
#
# Signalé par CodeQL sur le dépôt public — « Workflow does not contain permissions », ouvert
# et jamais lu. Sans ce bloc, GitHub donne au jeton de la passe les droits par défaut du
# dépôt, qui incluent l'écriture. Une chaîne qui ne fait que lire et lancer des cas n'a besoin
# que de lire.
#
# Ce n'est pas théorique ici : la chaîne tourne sur `pull_request`, donc sur du code que
# quelqu'un d'extérieur propose. Un jeton en écriture dans un contexte qui exécute du code
# étranger est la faute que cette catégorie entière décrit.
permissions:
  contents: read

jobs:
  test:
    # ─── DEUX VERSIONS DE NODE, PARCE QU'ON EN DÉCLARE UNE INFINITÉ ───
    #
    # `engines` dit `>=24`. La passe n'en éprouvait qu'une : 24. La machine de développement
    # tourne en 26, donc les deux seules versions jamais exercées l'étaient chacune d'un côté,
    # et rien ne comparait leurs résultats.
    #
    # Ce n'est pas théorique pour ce produit : le client installe et lance chez lui, sur la
    # version qu'il a. Une promesse « ça tourne chez vous » qui n'a été vérifiée que sur la
    # version du développeur est une promesse sur une machine.
    #
    # 24 est la version d'appui long ; 26 est celle de développement. Les deux, à chaque
    # passe. Le jour où une troisième arrive, on l'ajoute ici plutôt que de l'apprendre d'un
    # acheteur.
    strategy:
      fail-fast: false          # une version qui casse ne cache pas l'autre
      matrix:
        node: ['24', '26']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # L'HISTORIQUE ENTIER, ET C'EST LA RAISON POUR LAQUELLE CETTE PASSE ÉTAIT ROUGE.
          #
          # `checkout` clone à profondeur 1 par défaut : un seul commit. Or plusieurs cas
          # interrogent l'historique — quel commit a introduit un choix de formulation, si la
          # notation d'un corpus a bien été committée AVANT la mesure qu'elle régit, si un
          # relevé livré cite un commit qui existe. Sur un clone tronqué, ils tombent tous, et
          # ils ont raison de tomber : l'historique n'est pas là.
          #
          # Cinq passes rouges d'affilée, et le dépôt public portait une croix sur son dernier
          # commit. Les cas n'étaient pas faux — l'environnement l'était. Corrigé après avoir
          # lu les journaux plutôt qu'après avoir supposé.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Les poids d'encodeur — 740 Mo, mesurés — vivent sous node_modules, ce que la
      # bibliothèque décide et pas nous. La clé porte le verrou de dépendances : une
      # bibliothèque qui change de version peut changer de disposition.
      - name: cache des poids de modèle
        uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: poids-${{ matrix.node }}-${{ hashFiles('package-lock.json') }}

      - run: npm install

      # ─── LES POIDS S'AMORCENT HORS DÉLAI DE CAS ───
      #
      # Œuf-et-poule mesuré le 27/08/2026 : le cache `poids-*` n'a JAMAIS existé, parce que
      # `actions/cache` ne sauve qu'en fin de job réussi et qu'aucun job n'avait jamais réussi.
      # Le premier téléchargement (496,6 Mo pour `large`) se faisait tuer par le délai du CAS
      # qui le déclenchait, laissait un model.onnx à 52,3 Mo, et la garde des poids — qui fait
      # son travail — refusait la suite entière en désignant le fichier coupé.
      #
      # `--prime` purge les tronqués puis télécharge, sous un délai de PAS et non de cas. Le
      # premier tour vert sauve enfin le cache ; les suivants ne paient que la vérification.
      - name: amorcer les poids
        run: node src/poids.ts --prime
        timeout-minutes: 25

      # `npm test` rend 0 quand des cas s'ignorent. On lit le compte et on refuse : un cas qui
      # n'a pas regardé ne doit pas compter comme un cas qui a regardé, et une construction
      # verte sur un contrôle qui ne s'est pas exécuté est exactement ce qu'on passe la journée
      # à corriger ailleurs.
      - name: suite, et aucun cas ignoré
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/suite.txt
          # LE MARQUEUR CHERCHÉ N'A JAMAIS ÉTÉ ÉCRIT PAR CE RAPPORTEUR.
          #
          # Ce pas cherchait `^# skipped N`, la forme TAP. `node --test` écrit `ℹ skipped N`
          # et, par cas, `﹣ nom  # raison`. Mesuré le 26 août 2026 sur une suite portant un
          # vrai `t.skip()` : zéro correspondance pour les deux motifs. `ignores` retombait
          # donc sur `${ignores:-0}` à chaque passe, et le refus n'a jamais pu se déclencher.
          #
          # Et c'est ce `:-0` qui l'a caché : « ligne introuvable » et « zéro cas ignoré »
          # rendaient le même chiffre. L'absence de mesure ne doit pas se lire comme une
          # mesure à zéro — c'est la faute que ce dépôt corrige partout ailleurs.
          ignores=$(grep -oE '^(ℹ|#) skipped [0-9]+' /tmp/suite.txt | grep -oE '[0-9]+' | head -1)
          if [ -z "$ignores" ]; then
            echo ""
            echo "::error::la ligne de résumé « skipped » est introuvable dans la sortie de la suite."
            echo "Le rapporteur a changé de forme, ou la suite n'est pas allée jusqu'au résumé."
            echo "Ce pas ne peut RIEN conclure sur les cas ignorés : il refuse au lieu de compter zéro."
            exit 1
          fi
          if [ "$ignores" != "0" ]; then
            echo ""
            echo "::error::$ignores cas ignoré(s) — ils n'ont rien vérifié, et une construction verte le cacherait."
            grep -E '^﹣ ' /tmp/suite.txt | head -10
            echo ""
            echo "Le plus probable : les poids d'encodeur ne sont pas en cache, donc le contrôle"
            echo "qui garantit qu'aucune valeur du client ne sort ne s'est pas exécuté."
            exit 1
          fi
