# Les tests ne valent que s'ils tournent sans qu'on y pense.
name: verifier
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      # Le typage passe avant les tests : une erreur de type fait échouer la suite.
      - run: npm test
